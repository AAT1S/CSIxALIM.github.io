<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSIxALIM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 380px;
            padding: 40px 25px;
            text-align: center;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #E50914;
        }

        .subtitle {
            color: #888;
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 8px;
            margin-bottom: 35px;
        }

        .description {
            color: #bbb;
            margin-bottom: 25px;
        }

        .link {
            display: block;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid #333;
            color: white;
            text-decoration: none;
            background: #0b0b0b;
            transition: 0.3s;
        }

        .link:hover {
            border-color: #E50914;
            color: #E50914;
            transform: translateY(-2px);
        }

        .line {
            height: 1px;
            background: #E50914;
            margin: 30px 0;
        }

        .footer {
            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            CSI<span>x</span>ALIM
        </div>

        <div class="subtitle">
            CYBERSECURITY INTELLIGENCE
        </div>

        <div class="description">
            Cybersecurity • OSINT • Intelligence
        </div>

        <a class="link" href="#" target="_blank">
            INSTAGRAM
        </a>

        <a class="link" href="#" target="_blank">
            TELEGRAM
        </a>

        <a class="link" href="#" target="_blank">
            TIKTOK
        </a>

        <a class="link" href="#" target="_blank">
            YOUTUBE
        </a>

        <div class="line"></div>

        <div class="footer">
            CSIxALIM — CYBERSECURITY INTELLIGENCE
        </div>

    </div>

</body>
</html>
